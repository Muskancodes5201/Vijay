<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>vijay ji</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background: lightblue;
      width:100vw;
      height:100vh;
      display:grid;
      place-content:center;
      font-family: Arial, sans-serif;
    }

    .card{
      background-color: grey;
      width:300px;
      border-radius:20px;
      overflow:hidden;
      text-align:center;
      box-shadow:0 0 10px rgba(0,0,0,0.3);
    }

    img{
      width:100%;
      display:block;
    }

    a{
      font-size:20px;
      background-color:whitesmoke;
      display:block;
      margin:10px;
      padding:10px;
      border-radius:15px;
      text-decoration:none;
      color:black;
      font-weight:bold;
    }

    a:hover{
      background:black;
      color:white;
    }

  </style>
</head>

<body>

  <div class="card">

    <img src="vijay.png" alt="vijay thalapathy">
     <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
      </div>
    </div>


    <!-- Divider -->
    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-diamond"></div>
      <div class="divider-line"></div>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat">
        <div class="stat-num">67+</div>
        <div class="stat-label">Films</div>
      </div>
      <div class="stat">
        <div class="stat-num">30+</div>
        <div class="stat-label">Years</div>
      </div>
      <div class="stat">
        <div class="stat-num">100M+</div>
        <div class="stat-label">Fans</div>
      </div>
    </div>

    <!-- Tags -->
    <div class="tags">
      <span class="tag"><i class="fa-solid fa-film"></i> Actor</span>
      <span class="tag"><i class="fa-solid fa-music"></i> Singer</span>
      <span class="tag"><i class="fa-solid fa-masks-theater"></i> Producer</span>
      <span class="tag"><i class="fa-solid fa-flag"></i> Politician</span>
    </div>

    <!-- Social -->
    <div class="social-row">
      <a class="social-btn" href="#" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
      <a class="social-btn" href="#" title="Twitter / X"><i class="fa-brands fa-x-twitter"></i></a>
      <a class="social-btn" href="#" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
      <a class="social-btn" href="#" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
    </div>

    
  </div>
</div>


    <a href="https://instagram.com/@actorvijay" target="_blank">
      vijay thalapathy
    </a>

  </div>

</body>
</html>
